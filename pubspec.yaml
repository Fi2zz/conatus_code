name: conatus_code
description: >-
  A terminal coding agent built on the conatus runtime.
version: 0.1.0
repository: https://github.com/Fi2zz/conatus_code
issue_tracker: https://github.com/Fi2zz/conatus_code/issues
publish_to: none

environment:
  sdk: ^3.6.0

# 由 git filter 管理：工作区为生效状态，提交时自动注释掉，因此独立 clone 仍按
# 下面的 git 依赖解析。见 README「在 conatus 仓库内开发」。
# resolution: workspace

dependencies:
  conatus:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master}
  conatus_coding:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_coding}
  conatus_fs_tools:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_fs_tools}
  conatus_tui:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_tui}

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

# conatus 的包尚未发布到 pub.dev，独立 clone 时它们的传递依赖以 hosted 声明，
# 必须逐个 override 到 git 源，否则版本求解会因"同包两种来源"失败。直接依赖也
# 一并列出：它们同样被其它包以 hosted 引用。
# 在 conatus 仓库内开发时，本地 pubspec_overrides.yaml（由
# tool/setup_code_filter.sh 生成）会清空本节 —— workspace 禁止 override 成员包。
dependency_overrides:
  conatus_agent:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_agent}
  conatus_alerting:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_alerting}
  conatus_asr:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_asr}
  conatus_browser_use:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_browser_use}
  conatus_coding:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_coding}
  conatus_compaction:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_compaction}
  conatus_computer_use:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_computer_use}
  conatus_core:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_core}
  conatus_credentials:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_credentials}
  conatus_cron:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_cron}
  conatus_foundation:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_foundation}
  conatus_fs_tools:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_fs_tools}
  conatus_intent:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_intent}
  conatus_llm:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_llm}
  conatus_mcp:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_mcp}
  conatus_observability:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_observability}
  conatus_ontology:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_ontology}
  conatus_providers:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_providers}
  conatus_schedule:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_schedule}
  conatus_search:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_search}
  conatus_skill:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_skill}
  conatus_tasks:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_tasks}
  conatus_team:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: master, path: packages/conatus_team}
  conatus_tts:
