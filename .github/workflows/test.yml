# conatus_code 的 CI。
#
# 跑的是**独立形态**：checkout 拿到的是提交态 pubspec —— `resolution: workspace`
# 被 git filter（tool/setup_code_filter.sh，见 .gitattributes）注释掉，
# dependency_overrides 照常生效，依赖经 git 拉 conatus 的 master。
# 即这里验证的正是「用户 git clone 本仓库后拿到的东西」，而不是 conatus
# 工作区内的集成状态。跨仓集成由 conatus 仓库的 CI 负责。
#
# 刻意不加 Gitee 镜像：发布路径只有 dist/nava 二进制，不走仓库分发。
name: Test

on:
  push:
  pull_request:

# 同一分支连推多次时取消旧 run，不必排队等一串过期结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS 跑全量测试（本机开发主平台）。
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          # 钉到本地验证过的版本。pubspec 下限是 ^3.10.0（dart_io_sandbox），
          # 但让 SDK 自由漂移会让「代码回归」与「SDK 行为变化」分不开；
          # 升 SDK 请显式改这一行，好让 diff 里看得出是刻意为之。
          sdk: "3.12.2"

      # 独立形态的依赖解析要 clone 整个 conatus 仓库（22 条 override 指向
      # git 源），冷缓存 40s 起（网络抖动时更久），重复跑时缓存收益明显。
      # pubspec.lock 未入库，故按 pubspec.yaml 做 key。
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - run: dart pub get

      # --fatal-infos：本仓库把 info 也当错误治（见 analysis_options.yaml）。
      - run: dart analyze --fatal-infos

      - run: dart test

      # 本仓库唯一的产物是自包含二进制，这条打包路径此前从未被自动验证过。
      # dist/ 已 gitignore，不会污染工作区。
      - name: Build binary
        run: |
          bash tool/build_binary.sh
          ./dist/nava --version

  # Linux / Windows 冒烟：项目注册表（SQLite）与本地文件工具可用，二进制能启动。
  # 不跑全量测试，避免把 POSIX 专属测试当成跨平台回归。
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2"

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - run: dart test test/platform_smoke_test.dart

      - name: Fetch sqlite3.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/fetch_sqlite3_dll.ps1

      - name: Build binary
        shell: bash
        run: bash tool/build_binary.sh

      - name: Run binary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nava-smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/nava.exe --version
            NAVA_HOME="$(cygpath -w "$RUNNER_TEMP/nava-smoke")" \
              ./dist/nava.exe project prune
          else
            ./dist/nava --version
            NAVA_HOME="$RUNNER_TEMP/nava-smoke" ./dist/nava project prune
          fi
